# Configuration de test — base H2 en mémoire (aucun PostgreSQL requis)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schéma généré depuis les entités JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Pas de data.sql en test : le seed est fait par ReservationSecurityIntegrationTest
spring.sql.init.mode=never

# Le code utilise des références circulaires (jwtRequestFilter <-> WebSecurityConfiguration)
spring.main.allow-circular-references=true
